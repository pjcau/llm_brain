#cloud-config
# Hetzner → Create server → Cloud config: paste this. Ubuntu 24.04, CAX11.
# Creates the `brain` user, installs Caddy + Litestream, hardens SSH, opens
# 80/443 only. The binary and .env are installed afterwards (see
# docs/deploy-vps.md).
package_update: true
package_upgrade: true
packages: [ufw, fail2ban, unattended-upgrades, git, curl, ca-certificates, debian-keyring, debian-archive-keyring, apt-transport-https]
users:
  - name: brain
    system: true
    shell: /usr/sbin/nologin
    home: /opt/llm_brain
write_files:
  - path: /etc/ssh/sshd_config.d/hardening.conf
    content: |
      PasswordAuthentication no
      PermitRootLogin prohibit-password
      KbdInteractiveAuthentication no
  - path: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
runcmd:
  # Caddy (official repo)
  - curl -1sLf https://dl.cloudsmith.io/public/caddy/stable/gpg.key | gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
  - curl -1sLf https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt > /etc/apt/sources.list.d/caddy-stable.list
  - apt-get update && apt-get install -y caddy
  # Litestream (SQLite replication)
  - ARCH=$(dpkg --print-architecture); curl -fsSL -o /tmp/litestream.deb "https://github.com/benbjohnson/litestream/releases/latest/download/litestream-$(curl -fsSL https://api.github.com/repos/benbjohnson/litestream/releases/latest | grep -o '"tag_name": *"[^"]*"' | cut -d'"' -f4 | sed 's/^v//')-linux-${ARCH}.deb" && dpkg -i /tmp/litestream.deb || true
  # firewall: SSH + HTTP(S) only
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow OpenSSH
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw --force enable
  - systemctl enable --now fail2ban
  - mkdir -p /opt/llm_brain/data /opt/llm_brain/config && chown -R brain:brain /opt/llm_brain
  - systemctl restart ssh
